# 日次の更新（設計方針 8.1）。
# 毎日 日本時間 06:00 に、取り込み → 派生計算 → 書き出し → ビルドを行い、dist/ を artifact に残す。
# 配信（mixhost への rsync/SSH）は deploy ジョブ。実データの実行で、配信用の secrets が揃っているときだけ転送する。
# 手順と運用上の注意（cache の扱い、secrets の登録、失敗時の見方）は docs/07_運用手順.md を参照。
name: Daily

on:
  schedule:
    # 日本時間 06:00 = UTC 21:00（前日）。GitHub 側の混雑で数分から十数分遅れることがある。
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      recent_days:
        description: '直近の取り込み日数（通常は 7。失敗が続いた後や cache を失った後の取り直しで増やす）'
        type: string
        required: false
        default: '7'
      ranked_pages:
        description: '人気順の取り込みページ数（通常は 5。取り直しで増やす）'
        type: string
        required: false
        default: '5'

# 日次は同時に 2 つ動かさない。実行中のものは止めず、後から来たものを待たせる。
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

env:
  DB_PATH: data/catalog.sqlite
  EXPORT_DIR: data/export

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # 実データ（FANZA API）で作ったときだけ 'true'。配信を有効にするときの条件に使う。
      real_data: ${{ steps.creds.outputs.have_api }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          # push しないので git の認証情報は残さない
          persist-credentials: false

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # secrets は step の if 条件で直接は使えないので、有無の判定だけをこのステップで行い、結果を出力に残す。
      # secrets はこのステップと「実データを取り込む」ステップにだけ渡す（npm ci などには渡さない）。
      - name: API 認証情報の有無を確認
        id: creds
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
        run: |
          if [ -n "$FANZA_API_ID" ] && [ -n "$FANZA_AFFILIATE_ID" ]; then
            echo "have_api=true" >> "$GITHUB_OUTPUT"
            echo "データの取得元: 実データ（FANZA API）" >> "$GITHUB_STEP_SUMMARY"
            echo "FANZA_API_ID と FANZA_AFFILIATE_ID が両方あります。実データを取り込みます。"
          else
            echo "have_api=false" >> "$GITHUB_OUTPUT"
            echo "データの取得元: 合成データ（認証情報がないための代替。配信には使わない）" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=合成データで代替::FANZA_API_ID と FANZA_AFFILIATE_ID の両方が設定されていないため、API を使わず合成データで代替します。この実行の dist は配信に使わないこと。"
          fi

      # DB の cache は実データのときだけ使う（合成データを実データの DB に混ぜない）。
      # cache は同じキーで上書きできないので、キーは実行ごとに変える（保存側も同じ形）。
      # 復元は restore-keys の前方一致で、いちばん新しいものが選ばれる。
      # 7 日アクセスがないと GitHub が cache を消すため、空の DB から始まっても動く作りにしてある。
      - name: DB を cache から復元（実データのときだけ）
        id: restore
        if: steps.creds.outputs.have_api == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/catalog.sqlite
          key: catalog-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            catalog-db-v1-

      - name: 実データを取り込む
        if: steps.creds.outputs.have_api == 'true'
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
          RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          # 手動実行のときだけ入力で変えられる。定期実行は 7 と 5。
          RECENT_DAYS: ${{ inputs.recent_days || '7' }}
          RANKED_PAGES: ${{ inputs.ranked_pages || '5' }}
        run: |
          if [ -n "$RESTORED_KEY" ]; then
            echo "復元した DB の cache: $RESTORED_KEY"
          else
            echo "::warning title=cache なし::復元できる DB の cache がないため、空の DB から始めます。取り込まれるのは直近 ${RECENT_DAYS} 日分と人気順の上位 ${RANKED_PAGES} ページ分だけです。必要なら手動実行で範囲を広げてください（docs/07_運用手順.md の 3.5 節）。"
          fi
          npm run ingest -- --recent-days "$RECENT_DAYS" --refresh --ranked-pages "$RANKED_PAGES"

      - name: 合成データで代替する（認証情報なし）
        if: steps.creds.outputs.have_api != 'true'
        run: |
          echo "認証情報がないため、API を使わず合成データ 3000 件で代替します（cache は使いません）。"
          npm run ingest -- --synthetic 3000

      - name: 派生データを計算する
        run: npm run derive

      - name: 探索用 JSON を書き出す
        run: npm run export

      - name: サイトをビルドする
        # prebuild が走り、scripts/copy-export.mjs が data/export の JSON を public/data にコピーする
        run: npm run build

      # 取り込みから build までが全部成功したときだけ保存する（失敗した実行の DB は残さない）。
      - name: DB を cache に保存（実データのときだけ）
        if: steps.creds.outputs.have_api == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/catalog.sqlite
          key: catalog-db-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: dist を artifact に保存
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
          # .htaccess や .well-known など、ドットで始まるファイルも含める
          include-hidden-files: true

  # 配信。dist/ を rsync over SSH でホストへ同期する（scripts/deploy.sh）。
  # 動くのは「実データの実行」かつ「接続用の secrets が 4 つ揃っている」ときだけ。
  # 合成データの dist は本番へ出さない。secrets が欠けているときは何も転送せず、ジョブは成功で終わる。
  # secrets は if に直接書けないので、判定ステップで has_deploy を出力し、後続ステップで使う。
  # 設定の手順は docs/07_運用手順.md の 5 章を参照。
  deploy:
    needs: update
    if: ${{ needs.update.outputs.real_data == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 配信用 secrets の有無を確認
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_PATH" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "has_deploy=true" >> "$GITHUB_OUTPUT"
            echo "配信: 実施する" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_deploy=false" >> "$GITHUB_OUTPUT"
            echo "配信: 見送り（DEPLOY_HOST・DEPLOY_USER・DEPLOY_PATH・DEPLOY_SSH_KEY のいずれかが未登録）" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=配信を見送り::配信用の secrets が揃っていないため、転送しません。"
          fi

      - name: チェックアウト（scripts/deploy.sh のため）
        if: steps.gate.outputs.has_deploy == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: dist をダウンロード
        if: steps.gate.outputs.has_deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: SSH 鍵と known_hosts を用意
        if: steps.gate.outputs.has_deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ホストの公開鍵を取得して登録する（初回の接続で確認を求められないようにする）
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: ホストへ配信
        if: steps.gate.outputs.has_deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_CHECK_URL: ${{ secrets.DEPLOY_CHECK_URL }}
        run: |
          export DEPLOY_KEY_FILE="$HOME/.ssh/deploy_key"
          scripts/deploy.sh

      # 成功・失敗にかかわらず、鍵はジョブの終わりに消す。
      - name: SSH 鍵を削除
        if: always() && steps.gate.outputs.has_deploy == 'true'
        run: rm -f ~/.ssh/deploy_key
